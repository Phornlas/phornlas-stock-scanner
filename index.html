<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phornlas Stock Scanner</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f4;--surface:#ffffff;--border:#e8e6e1;
  --text:#1a1a1a;--muted:#6b6b6b;--faint:#9a9a9a;
  --green:#0f6e56;--green-bg:#e1f5ee;--green-mid:#1d9e75;
  --red:#a32d2d;--red-bg:#fcebeb;--red-mid:#e24b4a;
  --amber:#854f0b;--amber-bg:#faeeda;--amber-mid:#ba7517;
  --blue:#185fa5;--blue-bg:#e6f1fb;--blue-mid:#378add;
  --radius:10px;--radius-sm:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.app{max-width:700px;margin:0 auto;padding:20px 16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.logo{font-size:20px;font-weight:600;letter-spacing:-0.3px}
.logo span{color:var(--green-mid)}
button{font-family:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:var(--radius-sm);padding:7px 13px;font-size:13px;transition:background 0.15s}
button:hover{background:var(--bg)}
button.primary{background:var(--green-mid);color:#fff;border-color:var(--green-mid)}
button.primary:hover{background:var(--green)}
button.danger{background:var(--red-bg);color:var(--red);border-color:#f7c1c1;font-size:11px;padding:4px 8px}
.add-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.add-bar input{flex:1;max-width:180px;padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:13px;background:var(--surface);outline:none;text-transform:uppercase}
.add-bar input:focus{border-color:var(--green-mid)}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.metric-label{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.4px}
.metric-value{font-size:20px;font-weight:600}
.metric-value.blue{color:var(--blue-mid)}
.metric-value.green{color:var(--green-mid)}
.filter-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter-chip{padding:5px 12px;border-radius:20px;font-size:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.filter-chip.active{background:var(--text);color:#fff;border-color:var(--text)}
.table-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);margin-bottom:10px}
.scroll-area{max-height:90vh;overflow-y:auto}
.scroll-area::-webkit-scrollbar{width:4px}
.scroll-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
table{width:100%;border-collapse:collapse}
thead{position:sticky;top:0;z-index:1;background:var(--bg)}
th{padding:10px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;min-width:60px}
th:hover{color:var(--text)}
td{padding:10px 12px;border-bottom:1px solid #f0ede8;font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.main-row{cursor:pointer}
tr.main-row:hover td{background:#faf9f6}
tr.main-row.selected td{background:var(--blue-bg)}
.scroll-hint{text-align:center;font-size:11px;color:var(--faint);padding:6px;border-top:1px solid var(--border)}
.ticker{font-weight:700;font-size:14px}
.ticker-name{font-size:11px;color:var(--faint);display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.price{font-weight:600}
.rsi-wrap{display:flex;align-items:center;gap:6px}
.rsi-bar{width:48px;height:5px;background:#eee;border-radius:3px;overflow:hidden;flex-shrink:0}
.rsi-fill{height:100%;border-radius:3px}
.signal-badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;display:inline-block}
.sig-opportunity{background:var(--blue-bg);color:var(--blue)}
.sig-watch{background:var(--green-bg);color:var(--green)}
.sig-normal{background:#f0ede8;color:var(--muted)}
.detail-panel{background:var(--surface);border:1px solid var(--blue-mid);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:none}
.panel-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
.panel-name{font-size:15px;font-weight:600;color:var(--text)}
.panel-fullname{font-size:12px;color:var(--muted);margin-top:2px}
.panel-desc{font-size:12px;color:var(--muted);background:var(--bg);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:12px;line-height:1.6}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:2px}
.dv{font-size:13px;font-weight:600;color:var(--text)}
.dv.pos{color:var(--green)}
.dv.neg{color:var(--red-mid)}
.dv.amber{color:var(--amber-mid)}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--green-mid);border-radius:50%;animation:spin 0.7s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:10px 18px;border-radius:var(--radius-sm);font-size:13px;opacity:0;transition:opacity 0.2s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
.info-note{font-size:11px;color:var(--faint);margin-top:12px;line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Phornlas Stock <span>Scanner</span></div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span style="font-size:12px;color:var(--faint)" id="last-update">ยังไม่ได้ดึงข้อมูล</span>
      <button class="primary" onclick="refreshAll()">⟳ รีเฟรช</button>
    </div>
  </header>

  <div class="add-bar">
    <input type="text" id="ticker-input" placeholder="เพิ่มหุ้น เช่น AOT" maxlength="12" onkeydown="if(event.key==='Enter')addTicker()">
    <button class="primary" onclick="addTicker()">+ เพิ่ม</button>
    <button onclick="resetToDefault()" style="font-size:12px;color:var(--muted)">↺ คืนค่า</button>
  </div>

  <div class="summary-grid">
    <div class="metric-card"><div class="metric-label">หุ้นทั้งหมด</div><div class="metric-value" id="m-total">—</div></div>
    <div class="metric-card"><div class="metric-label">🔵 มีโอกาส</div><div class="metric-value blue" id="m-opp">—</div></div>
    <div class="metric-card"><div class="metric-label">🟢 น่าสนใจ</div><div class="metric-value green" id="m-watch">—</div></div>
  </div>

  <div class="filter-bar">
    <span class="filter-chip active" onclick="setFilter('all',this)">ทั้งหมด</span>
    <span class="filter-chip" onclick="setFilter('opportunity',this)">🔵 มีโอกาส</span>
    <span class="filter-chip" onclick="setFilter('watch',this)">🟢 น่าสนใจ</span>
    <span class="filter-chip" onclick="setFilter('target',this)">🎯 มี Target</span>
  </div>

  <div class="table-wrap">
    <div class="scroll-area">
      <table>
        <thead>
          <tr>
            <th onclick="sortBy('ticker')">หุ้น</th>
            <th onclick="sortBy('price')">ราคา (฿)</th>
            <th onclick="sortBy('rsi')">RSI Weekly</th>
            <th onclick="sortBy('signal')">สัญญาณ</th>
          </tr>
        </thead>
        <tbody id="stock-body"></tbody>
      </table>
    </div>
    <div class="scroll-hint">กดแถวเพื่อดูรายละเอียด · เลื่อนดูหุ้นทั้งหมด ↕</div>
  </div>

  <div class="detail-panel" id="detail-panel"></div>

  <div class="info-note">⚠️ ข้อมูลจาก Yahoo Finance (delayed ~15 นาที) · RSI Weekly 14 สัปดาห์ · ไม่ใช่คำแนะนำการลงทุน</div>
</div>
<div class="toast" id="toast"></div>

<script>
const SHEET_ID = '1f482N-mIR3oeAfebNy7EKc3lm4ihRyoNxo2kBC4WF-g';
const DEFAULT_WATCHLIST = ["88TH","ADVANC","ADVICE","BDMS","CENTEL","COM7","CPALL","CPI","DITTO","EFORL","FLOYD","ICHI","ILM","JCT","JDF","KAMART","KCG","KDH","KISS","LPH","LRH","MC","MINT","MOSHI","MRDIYT","NSL","PM","PR9","RAM","ROCK","SAUCE","SIS","SISB","SNPS","SYNEX","TMAN","TNP","VIH","WASH"];

let watchlist = JSON.parse(localStorage.getItem('thai_watchlist_v4') || 'null') || [...DEFAULT_WATCHLIST];
let stockData = {};
let sheetData = {};
let currentFilter = 'all';
let sortKey = 'signal';
let sortDir = 1;
let openTicker = null;

function saveWatchlist(){ localStorage.setItem('thai_watchlist_v4', JSON.stringify(watchlist)); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function fetchSheetData(){
  try {
    const res = await Promise.race([
      fetch('/api/quote?sheet=' + SHEET_ID),
      new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('timeout')); }, 8000); })
    ]);
    if (!res.ok) return;
    const text = await res.text();
    const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
    if (!match) return;
    const json = JSON.parse(match[1]);
    if (!json || !json.table || !json.table.rows) return;
    json.table.rows.forEach(function(row){
      const cols = row.c;
      if (!cols || !cols[0] || !cols[0].v) return;
      const ticker = String(cols[0].v).trim().toUpperCase();
      const target = cols[1] && cols[1].v ? parseFloat(cols[1].v) : null;
      const lastUpdated = cols[2] && cols[2].v ? String(cols[2].v).trim() : null;
      const dividendPerShare = cols[3] && cols[3].v ? parseFloat(cols[3].v) : null;
      const description = cols[4] && cols[4].v ? String(cols[4].v).trim() : null;
      sheetData[ticker] = { target: target, lastUpdated: lastUpdated, dividendPerShare: dividendPerShare, description: description };
    });
  } catch(e) { console.log('Sheet fetch failed:', e); }
}

function calcRSI(closes){
  if (closes.length < 15) return null;
  let gains = 0, losses = 0;
  for (let i = closes.length - 14; i < closes.length; i++) {
    const d = closes[i] - closes[i-1];
    if (d > 0) gains += d; else losses += Math.abs(d);
  }
  if (losses === 0) return 100;
  const rs = (gains / 14) / (losses / 14);
  return Math.round(100 - 100 / (1 + rs));
}

function calcYTD(closes, timestamps){
  if (!closes.length || !timestamps || !timestamps.length) return null;
  const startOfYear = new Date(new Date().getFullYear(), 0, 1).getTime() / 1000;
  let ytdClose = null;
  for (let i = 0; i < timestamps.length; i++) {
    if (timestamps[i] >= startOfYear) { ytdClose = closes[i]; break; }
  }
  if (!ytdClose) ytdClose = closes[0];
  const current = closes[closes.length - 1];
  return ((current - ytdClose) / ytdClose) * 100;
}

function calcSignal(rsi, price, ticker){
  const sheet = sheetData[ticker];
  const target = sheet ? sheet.target : null;
  if (rsi === null) return 'normal';
  if (rsi < 30 && target && price < target) return 'opportunity';
  if (rsi < 30) return 'watch';
  return 'normal';
}

function getUpdateColor(lastUpdated){
  if (!lastUpdated) return 'amber';
  const match = lastUpdated.match(/(\d{4})Q(\d)/);
  if (!match) return 'amber';
  const year = parseInt(match[1]);
  const quarter = parseInt(match[2]);
  const now = new Date();
  const curQ = Math.ceil((now.getMonth() + 1) / 3);
  const diffQ = (now.getFullYear() - year) * 4 + (curQ - quarter);
  if (diffQ <= 1) return 'pos';
  if (diffQ <= 2) return 'amber';
  return 'neg';
}

async function fetchStock(ticker){
  try {
    stockData[ticker] = Object.assign({}, stockData[ticker], { loading: true });
    renderTable();
    const res = await Promise.race([
      fetch('/api/quote?ticker=' + encodeURIComponent(ticker)),
      new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('timeout')); }, 12000); })
    ]);
    if (!res.ok) throw new Error('api error');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const result = data && data.chart && data.chart.result && data.chart.result[0];
    if (!result) throw new Error('no data');
    const meta = result.meta;
    const closes = (result.indicators && result.indicators.quote && result.indicators.quote[0] && result.indicators.quote[0].close || []).filter(function(v){ return v != null; });
    const timestamps = result.timestamp || [];
    const price = meta.regularMarketPrice || closes[closes.length-1] || 0;
    const rsi = calcRSI(closes);
    const ytd = calcYTD(closes, timestamps);
    const sheet = sheetData[ticker] || {};
    const divYield = sheet.dividendPerShare && price ? (sheet.dividendPerShare / price * 100) : (meta.dividendYieldExtra || (meta.trailingAnnualDividendYield ? meta.trailingAnnualDividendYield * 100 : 0));
    const name = meta.shortName || meta.longName || ticker;
    const signal = calcSignal(rsi, price, ticker);
    const upside = sheet.target && price ? ((sheet.target - price) / price * 100) : null;
    stockData[ticker] = {
      ticker: ticker, name: name, price: price, rsi: rsi, ytd: ytd,
      divYield: divYield, signal: signal, loading: false, error: false,
      target: sheet.target, upside: upside, lastUpdated: sheet.lastUpdated,
      description: sheet.description
    };
  } catch(e) {
    stockData[ticker] = { ticker: ticker, name: ticker, price: 0, rsi: null, ytd: null, divYield: 0, signal: 'normal', loading: false, error: true, target: null, upside: null, lastUpdated: null, description: null };
  }
  renderTable();
  updateSummary();
}

async function refreshAll(){
  document.getElementById('last-update').textContent = 'กำลังดึงข้อมูล...';
  await fetchSheetData();
  const BATCH = 3;
  for (let i = 0; i < watchlist.length; i += BATCH) {
    const batch = watchlist.slice(i, i + BATCH);
    await Promise.all(batch.map(function(t){ return fetchStock(t); }));
    await new Promise(function(r){ setTimeout(r, 300); });
  }
  let failed = watchlist.filter(function(t){ return stockData[t] && stockData[t].error; });
  if (failed.length > 0) {
    await new Promise(function(r){ setTimeout(r, 1500); });
    for (let i = 0; i < failed.length; i += 3) {
      await Promise.all(failed.slice(i, i+3).map(function(t){ return fetchStock(t); }));
      await new Promise(function(r){ setTimeout(r, 500); });
    }
  }
  failed = watchlist.filter(function(t){ return stockData[t] && stockData[t].error; });
  if (failed.length > 0) {
    await new Promise(function(r){ setTimeout(r, 2000); });
    await Promise.all(failed.map(function(t){ return fetchStock(t); }));
  }
  const now = new Date();
  document.getElementById('last-update').textContent = 'อัพเดท ' + now.toLocaleTimeString('th-TH', {hour:'2-digit',minute:'2-digit'});
}

function addTicker(){
  const input = document.getElementById('ticker-input');
  const raw = input.value.trim().toUpperCase().replace(/\.BK$/, '');
  if (!raw) return;
  if (watchlist.indexOf(raw) >= 0) { showToast(raw + ' มีอยู่แล้ว'); input.value = ''; return; }
  watchlist.push(raw);
  saveWatchlist();
  input.value = '';
  fetchStock(raw);
  showToast('เพิ่ม ' + raw + ' แล้ว');
}

function removeTicker(ticker){
  watchlist = watchlist.filter(function(t){ return t !== ticker; });
  delete stockData[ticker];
  saveWatchlist();
  if (openTicker === ticker) {
    document.getElementById('detail-panel').style.display = 'none';
    openTicker = null;
  }
  renderTable();
  showToast('ลบ ' + ticker + ' แล้ว');
}

function resetToDefault(){
  if (!confirm('รีเซ็ตกลับเป็นลิสต์เดิม?')) return;
  watchlist = [...DEFAULT_WATCHLIST];
  stockData = {};
  openTicker = null;
  document.getElementById('detail-panel').style.display = 'none';
  saveWatchlist();
  renderTable();
  refreshAll();
  showToast('รีเซ็ตลิสต์แล้ว');
}

function setFilter(f, el){
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(function(c){ c.classList.remove('active'); });
  el.classList.add('active');
  renderTable();
}

function sortBy(key){
  if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
  renderTable();
}

function toggleDetail(ticker){
  const panel = document.getElementById('detail-panel');
  document.querySelectorAll('tr.main-row').forEach(function(r){ r.classList.remove('selected'); });
  if (openTicker === ticker) {
    panel.style.display = 'none';
    openTicker = null;
    return;
  }
  openTicker = ticker;
  const row = document.querySelector('tr.main-row[data-ticker="' + ticker + '"]');
  if (row) row.classList.add('selected');
  const d = stockData[ticker];
  if (!d || d.loading || d.error) return;
  const cleanName = d.name.replace(/^[A-Z0-9]+[_ ]*/, '').replace(/^[_ ]+/, '').trim() || '';
  const sigLabel = { opportunity: '🔵 มีโอกาส', watch: '🟢 น่าสนใจ', normal: '⚪ ปกติ' }[d.signal] || '⚪ ปกติ';
  const sigClass = { opportunity: 'sig-opportunity', watch: 'sig-watch', normal: 'sig-normal' }[d.signal] || 'sig-normal';
  const ytdStr = d.ytd != null ? (d.ytd >= 0 ? '+' : '') + d.ytd.toFixed(1) + '%' : '—';
  const ytdClass = d.ytd > 0 ? 'pos' : d.ytd < 0 ? 'neg' : '';
  const divStr = d.divYield > 0 ? d.divYield.toFixed(1) + '%' : '—';
  const targetStr = d.target ? '฿' + d.target.toFixed(2) : '—';
  const upsideStr = d.upside != null ? (d.upside >= 0 ? '+' : '') + d.upside.toFixed(1) + '%' : '—';
  const upsideClass = d.upside > 0 ? 'pos' : d.upside < 0 ? 'neg' : '';
  const updStr = d.lastUpdated || '—';
  const updClass = getUpdateColor(d.lastUpdated);
  panel.innerHTML =
    '<div class="panel-header">' +
      '<div>' +
        '<div class="panel-name">' + d.ticker + '</div>' +
        (cleanName ? '<div class="panel-fullname">' + cleanName + '</div>' : '') +
      '</div>' +
      '<span class="signal-badge ' + sigClass + '">' + sigLabel + '</span>' +
    '</div>' +
    (d.description ? '<div class="panel-desc">' + d.description + '</div>' : '') +
    '<div class="detail-grid">' +
      '<div><div class="dl">%YTD</div><div class="dv ' + ytdClass + '">' + ytdStr + '</div></div>' +
      '<div><div class="dl">ปันผล Yield</div><div class="dv">' + divStr + '</div></div>' +
      '<div><div class="dl">Target</div><div class="dv">' + targetStr + '</div></div>' +
      '<div><div class="dl">Upside</div><div class="dv ' + upsideClass + '">' + upsideStr + '</div></div>' +
      '<div><div class="dl">อัปเดต Target</div><div class="dv ' + updClass + '">' + updStr + '</div></div>' +
      '<div><div class="dl"></div><div class="dv"><button class="danger" onclick="removeTicker(\'' + ticker + '\')">ลบออก</button></div></div>' +
    '</div>';
  panel.style.display = 'block';
  setTimeout(function(){
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 50);
}

function filterData(data){
  if (currentFilter === 'all') return data;
  if (currentFilter === 'opportunity') return data.filter(function(d){ return d.signal === 'opportunity'; });
  if (currentFilter === 'watch') return data.filter(function(d){ return d.signal === 'watch'; });
  if (currentFilter === 'target') return data.filter(function(d){ return d.target != null; });
  return data;
}

function signalOrder(s){ return { opportunity: 0, watch: 1, normal: 2 }[s] !== undefined ? { opportunity: 0, watch: 1, normal: 2 }[s] : 3; }

function renderTable(){
  const tbody = document.getElementById('stock-body');
  if (watchlist.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--faint)">เพิ่มหุ้นด้านบนได้เลย</td></tr>';
    return;
  }
  let rows = watchlist.map(function(t){ return stockData[t] || { ticker: t, loading: true }; });
  let completed = rows.filter(function(r){ return !r.loading && !r.error; });
  completed = filterData(completed);
  completed.sort(function(a, b){
    if (sortKey === 'ticker') return sortDir * a.ticker.localeCompare(b.ticker);
    let va, vb;
    if (sortKey === 'signal') { va = signalOrder(a.signal); vb = signalOrder(b.signal); }
    else if (sortKey === 'rsi') { va = a.rsi !== null ? a.rsi : 999; vb = b.rsi !== null ? b.rsi : 999; }
    else if (sortKey === 'price') { va = a.price; vb = b.price; }
    else { va = 0; vb = 0; }
    return sortDir * (va - vb);
  });
  const loading = rows.filter(function(r){ return r.loading; });
  const errored = rows.filter(function(r){ return !r.loading && r.error; });
  let html = '';
  completed.concat(loading).concat(errored).forEach(function(d){
    if (d.loading) {
      html += '<tr class="main-row"><td><span class="ticker">' + d.ticker + '</span></td><td colspan="3"><span class="spinner"></span>กำลังโหลด...</td></tr>';
      return;
    }
    if (d.error) {
      html += '<tr class="main-row"><td><span class="ticker">' + d.ticker + '</span></td><td colspan="3" style="color:var(--faint);font-size:12px">ไม่พบข้อมูล</td></tr>';
      return;
    }
    const rsiColor = d.rsi < 30 ? 'var(--red-mid)' : d.rsi < 45 ? 'var(--amber-mid)' : 'var(--green-mid)';
    const sigLabel = { opportunity: '🔵 มีโอกาส', watch: '🟢 น่าสนใจ', normal: '⚪ ปกติ' }[d.signal] || '⚪';
    const sigClass = { opportunity: 'sig-opportunity', watch: 'sig-watch', normal: 'sig-normal' }[d.signal] || 'sig-normal';
    const cleanName = d.name.replace(/^[A-Z0-9]+[_ ]*/, '').replace(/^[_ ]+/, '').trim();
    const isSelected = openTicker === d.ticker ? ' selected' : '';
    html += '<tr class="main-row' + isSelected + '" data-ticker="' + d.ticker + '" onclick="toggleDetail(\'' + d.ticker + '\')">' +
      '<td><span class="ticker">' + d.ticker + '</span>' + (cleanName ? '<span class="ticker-name">' + cleanName + '</span>' : '') + '</td>' +
      '<td><span class="price">฿' + (d.price > 0 ? d.price.toFixed(2) : '—') + '</span></td>' +
      '<td><div class="rsi-wrap"><div class="rsi-bar"><div class="rsi-fill" style="width:' + Math.min(100, d.rsi || 0) + '%;background:' + rsiColor + '"></div></div><span style="font-size:12px;color:' + rsiColor + ';font-weight:600">' + (d.rsi !== null ? d.rsi : '—') + '</span></div></td>' +
      '<td><span class="signal-badge ' + sigClass + '">' + sigLabel + '</span></td>' +

      '</tr>';
  });
  tbody.innerHTML = html || '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--faint)">ไม่มีหุ้นตรงกับตัวกรอง</td></tr>';
}

function updateSummary(){
  const all = Object.values(stockData).filter(function(d){ return !d.loading && !d.error; });
  document.getElementById('m-total').textContent = watchlist.length;
  document.getElementById('m-opp').textContent = all.filter(function(d){ return d.signal === 'opportunity'; }).length;
  document.getElementById('m-watch').textContent = all.filter(function(d){ return d.signal === 'watch'; }).length;
}

renderTable();
refreshAll();
</script>
</body>
</html>
